name: Сбор статистики Playables

on:
  schedule:
    # каждые 2 часа: GitHub может задерживать и пропускать запуски по расписанию,
    # а день теряется, только если за сутки не прошёл ни один. Снимок привязан к дате
    # данных источника, поэтому дублей не будет. Минута — не начало часа (там выше нагрузка).
    - cron: "23 */2 * * *"
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Только отправить тестовое сообщение в Telegram"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Тест Telegram
        if: ${{ inputs.test_telegram }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || vars.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: python3 tracker/alerts.py --test

      - name: Тесты
        if: ${{ !inputs.test_telegram }}
        run: python3 -m unittest discover -s tests

      - name: Скачать каталог и сохранить снимок
        if: ${{ !inputs.test_telegram }}
        id: collect
        run: python3 tracker/collect.py

      - name: Пересчитать метрики дашборда
        if: ${{ !inputs.test_telegram }}
        run: python3 tracker/build.py

      # Сбой уведомлений не должен мешать сохранить снимок: шаг коммита выполнится,
      # а весь запуск пометит упавшим последний шаг — GitHub пришлёт письмо.
      - name: Уведомления о пиках
        id: alerts
        if: ${{ !inputs.test_telegram }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || vars.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: python3 tracker/alerts.py

      # Выполняется и при ошибке сбора: иначе о сломанном источнике не узнаем в Telegram
      - name: Проверка свежести данных
        id: stale
        if: ${{ !cancelled() && !inputs.test_telegram }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || vars.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
        run: python3 tracker/alerts.py --check-stale

      # Тоже при любом исходе: сохраняем всё, что успели, и отметку о предупреждении,
      # иначе при падающем сборе предупреждение уходило бы каждые 2 часа
      # Статус последнего запуска для дашборда — пишется при любом исходе,
      # чтобы на сайте было видно, что сбор запускается и когда
      - name: Статус запуска для дашборда
        if: ${{ !cancelled() && !inputs.test_telegram }}
        env:
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
          ALERTS_OUTCOME: ${{ steps.alerts.outcome }}
          SNAPSHOT_DATE: ${{ steps.collect.outputs.date }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import datetime as dt, json, os
          ok = os.environ["COLLECT_OUTCOME"] == "success"
          json.dump({
            "run_at": dt.datetime.now(dt.timezone.utc).isoformat(timespec="seconds"),
            "ok": ok,
            "collect": os.environ["COLLECT_OUTCOME"],
            "alerts": os.environ["ALERTS_OUTCOME"],
            "snapshot": os.environ.get("SNAPSHOT_DATE") or None,
            "trigger": "cron" if os.environ["EVENT"] == "schedule" else "manual",
            "run_url": os.environ["RUN_URL"],
          }, open("docs/status.json", "w"), ensure_ascii=False, indent=1)
          PY

      - name: Закоммитить данные
        if: ${{ !cancelled() && !inputs.test_telegram }}
        env:
          SNAPSHOT_DATE: ${{ steps.collect.outputs.date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data.json docs/index.html docs/status.json
          if git diff --cached --quiet; then
            echo "Изменений нет"
            exit 0
          fi
          # новых данных нет — коммитим только статус (мелкий коммит каждые 2 часа)
          if git diff --cached --quiet -- data docs/data.json docs/index.html; then MSG="статус запуска";
          elif [ -n "$SNAPSHOT_DATE" ]; then MSG="снимок $SNAPSHOT_DATE"; else MSG="состояние уведомлений"; fi
          git commit -m "chore(data): $MSG"
          for i in 1 2 3; do
            git pull --rebase --quiet origin main && git push && exit 0
            echo "Пуш не удался (попытка $i), повтор через $((i * 15)) с"
            sleep $((i * 15))
          done
          exit 1

      - name: Сообщить о сбое уведомлений
        if: ${{ steps.alerts.outcome == 'failure' || steps.stale.outcome == 'failure' }}
        run: |
          echo "::error::Уведомления доставлены не всем — подробности в шаге «Уведомления о пиках». Данные сохранены."
          exit 1
