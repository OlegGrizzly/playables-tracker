name: Сбор статистики Playables

on:
  schedule:
    # каждые 6 часов: сайт обновляет данные раз в день в неизвестное время,
    # снимок привязан к дате данных источника, поэтому дублей не будет
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Тесты
        run: python3 -m unittest discover -s tests

      - name: Скачать каталог и сохранить снимок
        id: collect
        run: python3 tracker/collect.py

      - name: Пересчитать метрики дашборда
        run: python3 tracker/build.py

      - name: Уведомления о пиках
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: python3 tracker/alerts.py

      - name: Закоммитить данные
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data.json
          if git diff --cached --quiet; then
            echo "Изменений нет"
            exit 0
          fi
          git commit -m "chore(data): снимок ${{ steps.collect.outputs.date }}"
          git push
