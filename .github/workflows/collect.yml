name: Сбор статистики Playables

on:
  schedule:
    # каждые 6 часов: сайт обновляет данные раз в день в неизвестное время,
    # снимок привязан к дате данных источника, поэтому дублей не будет
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Только отправить тестовое сообщение в Telegram"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Тест Telegram
        if: ${{ inputs.test_telegram }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || vars.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: python3 tracker/alerts.py --test

      - name: Тесты
        if: ${{ !inputs.test_telegram }}
        run: python3 -m unittest discover -s tests

      - name: Скачать каталог и сохранить снимок
        if: ${{ !inputs.test_telegram }}
        id: collect
        run: python3 tracker/collect.py

      - name: Пересчитать метрики дашборда
        if: ${{ !inputs.test_telegram }}
        run: python3 tracker/build.py

      # Сбой уведомлений не должен мешать сохранить снимок: шаг коммита выполнится,
      # а весь запуск пометит упавшим последний шаг — GitHub пришлёт письмо.
      - name: Уведомления о пиках
        id: alerts
        if: ${{ !inputs.test_telegram }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || vars.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: python3 tracker/alerts.py

      - name: Закоммитить данные
        if: ${{ !inputs.test_telegram }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data.json docs/index.html
          if git diff --cached --quiet; then
            echo "Изменений нет"
            exit 0
          fi
          git commit -m "chore(data): снимок ${{ steps.collect.outputs.date }}"
          for i in 1 2 3; do
            git pull --rebase --quiet origin main && git push && exit 0
            echo "Пуш не удался (попытка $i), повтор через $((i * 15)) с"
            sleep $((i * 15))
          done
          exit 1

      - name: Сообщить о сбое уведомлений
        if: ${{ steps.alerts.outcome == 'failure' }}
        run: |
          echo "::error::Уведомления доставлены не всем — подробности в шаге «Уведомления о пиках». Данные сохранены."
          exit 1
