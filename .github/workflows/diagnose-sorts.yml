name: Diagnose catalogue sorting
on:
  push:
    branches: [diagnose-catalog-sorts]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - run: python3 tracker/diagnose_sorts.py
      - uses: actions/upload-artifact@v4
        with:
          name: playables-export
          path: playables.csv
